<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon платформы. Next подхватывает файл с этим именем сам — прописывать
    его в metadata не нужно.

    В отличие от знака в интерфейсе, здесь цвета заданы явно и знак стоит на
    залитой плашке: вкладка браузера не даёт ни currentColor, ни фона, а тонкие
    линии на 16 пикселях по светлой и по тёмной панели ведут себя по-разному.
    Плашка снимает вопрос в обоих случаях.
  -->
  <rect width="32" height="32" rx="7" fill="#126b54"/>
  <rect x="5" y="21" width="22" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="15" y="16" width="2" height="5" rx="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="22" cy="10.5" r="4" fill="#e8762a"/>
</svg>
